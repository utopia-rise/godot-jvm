site_name: Godot-JVM
site_description: Kotlin, Java, and Scala bindings for the Godot game engine.
site_author: Utopia Rise
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://godot-jvm.dev/en/stable/']
docs_dir: src/doc
strict: true
hooks:
  - logo_assets.py

repo_name: 'utopia-rise/godot-jvm'
repo_url: 'https://github.com/utopia-rise/godot-jvm'

theme:
  name: material
  favicon: logo/favicon.ico
  palette:
    - media: "(prefers-color-scheme)"
      primary: deep purple
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  logo: logo/logo.png
  font:
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/utopia-rise

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.details
  - admonition
  - meta

extra_css:
  - css/logo.css

