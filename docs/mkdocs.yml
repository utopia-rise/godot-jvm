site_name: Godot-JVM
site_description: Kotlin, Java, and Scala bindings for the Godot game engine.
site_author: Utopia Rise
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://godot-jvm.dev/en/stable/']
docs_dir: src/doc
strict: true
validation:
  links:
    anchors: warn
hooks:
  - logo_assets.py

repo_name: 'utopia-rise/godot-jvm'
repo_url: 'https://github.com/utopia-rise/godot-jvm'

theme:
  name: material
  custom_dir: src/overrides
  favicon: logo/logo-64.png
  palette:
    - media: "(prefers-color-scheme)"
      primary: deep purple
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  logo: logo/logo-64.png
  font:
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/utopia-rise

plugins:
  - redirects:
      redirect_maps:
        guide/enums-and-bitfields.md: reference/binding/types.md#enums-and-bitfields
        guide/abstract-classes.md: reference/registration/classes.md#abstract-classes
        guide/attaching-scripts.md: guide/registration-files.md
        reference/registration.md: reference/registration/index.md
        reference/property-hints.md: reference/annotations.md#property-hints
        reference/language-parity.md: reference/index.md
        reference/compatibility.md: start/compatibility.md
        build/index.md: guide/index.md#build-and-run
        troubleshooting/index.md: faq.md
        troubleshooting/build-and-registration.md: faq.md#build-and-registration
        troubleshooting/runtime.md: faq.md#startup-and-runtime
        troubleshooting/export.md: faq.md#export
        troubleshooting/known-limitations.md: faq.md#known-limitations
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - meta

extra_css:
  - css/logo.css

