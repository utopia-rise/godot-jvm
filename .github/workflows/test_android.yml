name: 🤖 Android Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-android_tests
  cancel-in-progress: true

jobs:
  test-android:
    runs-on: ubuntu-latest
    env:
      # See VersionInfoPlugin: drop the commit hash from the build version so cached Kotlin/native-image outputs stay valid.
      ORG_GRADLE_PROJECT_reproducibleVersion: 'true'
    name: ${{ matrix.name }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug export tests
            build-task: buildAndroid
            export-task: exportAndroidDebug
            variant: debug
          - name: Release export tests
            build-task: -Prelease buildAndroid
            export-task: exportAndroidRelease
            variant: release
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: linux
          destination: harness/tests/bin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36.1" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The Gradle build cache is shared through ./.github/actions/master-cache below, nothing else is worth caching.
          cache-disabled: true

      # Kotlin compile outputs are platform independent, so every job reads the two entries written by the Linux
      # test jobs: the debug one from the editor tests, the release one (DEBUG preprocessor flag off) from the Android
      # release tests. Both restore into the same directory; Gradle's build cache is content addressed.
      - name: Restore Gradle build cache (debug)
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: gradle-build-cache-debug
          path: ~/.gradle/caches/build-cache-1
      - name: Restore Gradle build cache (release)
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: gradle-build-cache-release
          path: ~/.gradle/caches/build-cache-1

      - name: Restore Android build output
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: android-build-${{ matrix.variant }}-${{ runner.os }}-${{ runner.arch }}
          # Compiled Godot-JVM libraries plus Gradle's per-build task history: the harness includes six builds and
          # each keeps its own .gradle/<version>/executionHistory. Without it nothing can be marked up to date.
          path: |
            kt/**/build
            kt/.gradle
            kt/api-generator/.gradle
            kt/common/.gradle
            kt/tools-common/.gradle
            kt/build-logic/.gradle
            harness/third-party-library/build
            harness/third-party-library/.gradle
            harness/tests/.gradle
            harness/tests/build

      - name: Download Linux editor library
        uses: actions/download-artifact@v7
        with:
          name: editor_linux_x86_64
          path: harness/tests/addons

      - name: Download Android addon
        uses: actions/download-artifact@v7
        with:
          pattern: godot-jvm-gdextension-android-*
          path: harness/tests
          merge-multiple: true

      - name: Prepare Android export template
        run: |
          chmod +x harness/tests/bin/godot.*
          curl --fail --location https://github.com/godotengine/godot-builds/releases/download/${{ inputs.godot-version }}/Godot_v${{ inputs.godot-version }}_export_templates.tpz --output templates.tpz
          unzip -q templates.tpz -d templates
          cp templates/templates/android_source.zip harness/tests/android_source.zip
          mkdir -p harness/tests/android/build/build
          unzip -q -o harness/tests/android_source.zip -d harness/tests/android/build/build
          printf 'res://android_source.zip [%s]\n' "$(md5sum harness/tests/android_source.zip | cut -d ' ' -f 1)" > harness/tests/android/build/.build_version
          touch harness/tests/android/build/build/.gdignore

      - name: Build JVM tests project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Create Android release test key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/godot-jvm-tests-release.keystore" \
            -alias godot-jvm-tests \
            -storepass godot-jvm-tests \
            -keypass godot-jvm-tests \
            -dname "CN=Godot-JVM Tests" \
            -keyalg RSA \
            -validity 10000 \
            -noprompt
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/godot-jvm-tests-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=godot-jvm-tests" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=godot-jvm-tests" >> "$GITHUB_ENV"

      - name: Export Android tests
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.export-task }}
        timeout-minutes: 30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run exported tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/test_android_emulator.sh

      - name: Upload Android emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.variant }}-emulator-logs
          path: android-emulator.log
          if-no-files-found: ignore

      - name: Save Android build output
        uses: ./.github/actions/master-cache
        with:
          mode: save
          cache-name: android-build-${{ matrix.variant }}-${{ runner.os }}-${{ runner.arch }}
          # Compiled Godot-JVM libraries plus Gradle's per-build task history: the harness includes six builds and
          # each keeps its own .gradle/<version>/executionHistory. Without it nothing can be marked up to date.
          path: |
            kt/**/build
            kt/.gradle
            kt/api-generator/.gradle
            kt/common/.gradle
            kt/tools-common/.gradle
            kt/build-logic/.gradle
            harness/third-party-library/build
            harness/third-party-library/.gradle
            harness/tests/.gradle
            harness/tests/build

      - name: Save Gradle build cache (release)
        if: matrix.variant == 'release'
        uses: ./.github/actions/master-cache
        with:
          mode: save
          cache-name: gradle-build-cache-release
          path: ~/.gradle/caches/build-cache-1
