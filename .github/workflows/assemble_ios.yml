name: Assemble iOS
on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string

jobs:
  package-ios-libraries:
    runs-on: macos-15
    steps:
      - name: Download iOS libraries
        uses: actions/download-artifact@v7
        with:
          pattern: '*_ios_*'
          path: libraries
          merge-multiple: true
      # The .gdextension manifest points at the bare .a archives SCons writes, the same files the
      # harness project uses locally, so only the intermediate object archives are dropped here.
      - name: Assemble iOS libraries
        shell: bash
        run: |
          set -euo pipefail
          ios_libraries=libraries/jvm/libs/ios
          ls -1 "$ios_libraries"
          for target in template_debug template_release; do
            if [[ ! -f "$ios_libraries/godot.jvm.ios.$target.a" ]]; then
              echo "Missing the iOS library for $target" >&2
              exit 1
            fi
          done
          rm "$ios_libraries"/*.objects.a
          mkdir -p package/addons
          cp -R libraries/jvm package/addons/jvm
      # Upload the raw folder rather than a pre-made zip: actions/upload-artifact always wraps
      # whatever it's given in its own zip, so uploading a zip here results in a zip nested inside
      # that zip once a human downloads the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: godot-jvm-gdextension-ios
          path: package
