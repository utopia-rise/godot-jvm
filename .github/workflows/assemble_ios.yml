name: Assemble iOS
on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string

jobs:
  package-ios-libraries:
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: '*_ios_*'
          path: libraries
          merge-multiple: true
      - name: Assemble iOS libraries
        shell: bash
        run: |
          mkdir -p package/addons
          cp -R libraries/jvm package/addons/jvm
      # Upload the raw folder rather than a pre-made zip: actions/upload-artifact always wraps
      # whatever it's given in its own zip, so uploading a zip here results in a zip nested inside
      # that zip once a human downloads the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: godot-jvm-gdextension-ios
          path: package
