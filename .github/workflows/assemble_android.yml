name: Assemble Android
on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string
      godot-version:
        type: string
      jvm-version:
        type: string

jobs:
  package-android-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}
      - uses: actions/download-artifact@v7
        with:
          pattern: '*_android_*'
          path: native
          merge-multiple: true
      - name: Build Android plugin AARs
        shell: bash
        env:
          GODOT_VERSION: ${{ inputs.godot-version }}
        run: |
          godot_maven_version="${GODOT_VERSION%-stable}.stable"
          ./kt/gradlew -p kt :android-plugin:assemble \
            -PgodotVersion="$godot_maven_version" \
            -PnativeLibrariesDir="$PWD/native/jvm/bin"
          # Godot loads the Android library from the AAR, so the package carries no bare .so: only
          # the two plugin AARs go out, and the guard below fails the job if anything else sneaks in.
          mkdir -p package/android
          cp kt/android-plugin/build/outputs/aar/godot-jvm-debug.aar kt/android-plugin/build/outputs/aar/godot-jvm-release.aar package/android/
          unexpected="$(find package -type f ! -name 'godot-jvm-debug.aar' ! -name 'godot-jvm-release.aar')"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files in the Android package:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
      # Upload the raw folder rather than a pre-made zip: actions/upload-artifact always wraps
      # whatever it's given in its own zip, so uploading a zip here results in a zip nested inside
      # that zip once a human downloads the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: godot-jvm-gdextension-android-${{ inputs.godot-jvm-version }}
          path: package
