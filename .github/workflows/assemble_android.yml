name: Assemble Android
on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string
      godot-version:
        type: string
      jvm-version:
        type: string

jobs:
  package-android-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}
      - uses: actions/download-artifact@v7
        with:
          pattern: '*_android_*'
          path: native
          merge-multiple: true
      - name: Build Android plugin AARs
        shell: bash
        env:
          GODOT_VERSION: ${{ inputs.godot-version }}
        run: |
          godot_maven_version="${GODOT_VERSION%-stable}.stable"
          ./kt/gradlew -p kt :android-plugin:assemble \
            -PgodotVersion="$godot_maven_version" \
            -PnativeLibrariesDir="$PWD/native/jvm/bin"
          # Godot loads the Android library from the AAR, but the .gdextension manifest must still point at
          # existing files: the asset library rejects a manifest whose library paths do not resolve, and the
          # official GDExtension Android plugin template ships its .so files next to the AAR the same way.
          for variant in debug release; do
            mkdir -p "package/addons/jvm/libs/android/$variant"
            cp "kt/android-plugin/build/outputs/aar/godot-jvm-$variant.aar" "package/addons/jvm/libs/android/$variant/"
            for abi in arm64-v8a x86_64; do
              mkdir -p "package/addons/jvm/libs/android/$variant/$abi"
              cp "native/jvm/bin/$variant/$abi/libgodot_jvm.so" "package/addons/jvm/libs/android/$variant/$abi/"
            done
          done
      # Upload the raw folder rather than a pre-made zip: actions/upload-artifact always wraps
      # whatever it's given in its own zip, so uploading a zip here results in a zip nested inside
      # that zip once a human downloads the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: godot-jvm-gdextension-android-${{ inputs.godot-jvm-version }}
          path: package
