name: Android Builds
on:
  workflow_call:
    inputs:
      jvm-version:
        type: string

jobs:
  android-template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - cache-name: debug_android_arm64
            target: template_debug
            scons-flags: arch=arm64
          - cache-name: release_android_arm64
            target: template_release
            scons-flags: arch=arm64
          - cache-name: debug_android_x86_64
            target: template_debug
            scons-flags: arch=x86_64
          - cache-name: release_android_x86_64
            target: template_release
            scons-flags: arch=x86_64
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;28.1.13356709"
      - run: python -m pip install scons
      - uses: ./.github/actions/scons-cache
        with:
          mode: restore
          cache-name: ${{ matrix.cache-name }}
      - uses: ./.github/actions/gdextension-build
        with:
          platform: android
          target: ${{ matrix.target }}
          scons-flags: ${{ matrix.scons-flags }}
          target-path: artifact/addons/jvm/bin/
      - uses: ./.github/actions/scons-cache
        if: always()
        with:
          mode: save
          cache-name: ${{ matrix.cache-name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cache-name }}
          path: artifact/addons
