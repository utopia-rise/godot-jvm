name: Windows Builds
on:
  workflow_call:

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-windows_build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    name: ${{ matrix.name }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build editor
            cache-name: editor_windows_x86_64
            target: editor
            should-clean: false
            scons-flags: ''
          - name: Build debug
            cache-name: debug_windows_x86_64
            target: template_debug
            should-clean: false
            scons-flags: ''
          - name: Build release
            cache-name: release_windows_x86_64
            target: template_release
            should-clean: true
            scons-flags: ''
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
      SCONS_CACHE_MSVC_CONFIG: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install scons
      - uses: ./.github/actions/scons-cache
        with:
          mode: restore
          cache-name: ${{ matrix.cache-name }}
      - uses: ammaraskar/msvc-problem-matcher@master
      - uses: ./.github/actions/gdextension-build
        with:
          platform: windows
          target: ${{ matrix.target }}
          scons-flags: ${{ matrix.scons-flags }}
          target-path: artifact/addons/jvm/libs/
      - uses: ./.github/actions/scons-cache
        if: always()
        with:
          mode: save
          cache-name: ${{ matrix.cache-name }}
      - shell: pwsh
        run: Remove-Item artifact/addons/jvm/libs/windows/*.exp, artifact/addons/jvm/libs/windows/*.lib -Force -ErrorAction SilentlyContinue
      - name: Remove debug symbols
        if: ${{ matrix.should-clean }}
        shell: pwsh
        run: Remove-Item artifact/addons/jvm/libs/windows/*.pdb -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cache-name }}
          path: artifact/addons
