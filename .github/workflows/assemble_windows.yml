name: 🪟 Assemble Windows
on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows_assemble
  cancel-in-progress: true

jobs:
  assemble-windows:
    # This only packages already-built libraries.
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows libraries
        uses: actions/download-artifact@v7
        with:
          pattern: '*_windows_x86_64'
          path: libraries
          merge-multiple: true

      # Upload the raw "addons" folder rather than a pre-made zip: actions/upload-artifact always
      # wraps whatever it's given in its own zip, so uploading a zip here results in a zip nested
      # inside that zip once a human downloads the artifact. The actual release-asset zip gets made
      # once, at the point deploy_godot.yml attaches it to the GitHub release.
      - name: Upload Windows libraries
        uses: actions/upload-artifact@v7
        with:
          name: godot-jvm-gdextension-windows-${{ inputs.godot-jvm-version }}
          path: libraries/jvm/libs
