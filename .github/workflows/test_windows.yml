name: 🪟 Windows Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows_tests
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: debug tests
            extension-target: debug
            build-task: build

    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: windows
          destination: harness/tests/bin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Visual Studio native-image environment
        shell: pwsh
        run: |
          $vcVars = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Filter vcvars64.bat -Recurse | Select-Object -First 1
          if ($null -eq $vcVars) { throw 'Could not find Visual Studio vcvars64.bat' }
          "VC_VARS_PATH=$($vcVars.FullName)" >> $env:GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always
          gradle-home-cache-excludes: |
            wrapper/dists
            caches/*/generated-gradle-jars
            daemon
            notifications

      - name: Cache desktop Graal build output
        uses: actions/cache@v4
        with:
          path: |
            harness/tests/.gradle
            harness/tests/build
          key: desktop-graal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test_windows.yml', 'harness/tests/**', 'harness/third-party-library/**', 'kt/**') }}
          restore-keys: |
            desktop-graal-${{ runner.os }}-${{ runner.arch }}-

      - name: Download windows editor library
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.extension-target }}_windows_x86_64
          path: './harness/tests/addons'

      - name: Build JVM tests project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Build Graal native image
        run: harness/tests/gradlew -p harness/tests/ buildGraalNativeImage

      - name: Import test project
        run: harness/tests/gradlew -p harness/tests/ importResources

      - name: Run JVM tests
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-amd64-windows
          ./gradlew runGDTests
        timeout-minutes: 30

      - name: Run Graal native-image tests
        run: |
          cd harness/tests/
          ./gradlew runGraalGDTests
        timeout-minutes: 30
