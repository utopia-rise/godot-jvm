name: 🪟 Windows Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows_tests
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    env:
      # See VersionInfoPlugin: drop the commit hash from the build version so cached Kotlin/native-image outputs stay valid.
      ORG_GRADLE_PROJECT_reproducibleVersion: 'true'
    name: ${{ matrix.name }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - name: Editor tests
            release: false
            variant: editor
            build-task: build
            graal-build-task: buildGraalNativeImage
          - name: Release export tests
            release: true
            variant: export
            build-task: buildRelease
            graal-build-task: buildGraalNativeImageRelease
            export-task: exportRelease
            graal-export-task: exportGraalRelease
            export-library: release_windows_x86_64
          - name: Debug export tests
            release: false
            variant: export
            build-task: build
            graal-build-task: buildGraalNativeImage
            export-task: exportDebug
            graal-export-task: exportGraalDebug
            export-library: debug_windows_x86_64

    steps:
      - name: Clone Godot JVM module
        uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: windows
          destination: harness/tests/bin

      - name: Download debug export templates
        if: matrix.variant == 'export'
        uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: windows
          destination: harness/tests/bin
          template: debug

      - name: Download release export templates
        if: matrix.variant == 'export'
        uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: windows
          destination: harness/tests/bin
          template: release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Visual Studio native-image environment
        shell: pwsh
        run: |
          $vcVars = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
          if ([string]::IsNullOrEmpty($vcVars)) { throw 'Could not find Visual Studio vcvars64.bat' }
          "VC_VARS_PATH=$vcVars" >> $env:GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The Gradle build cache is shared through ./.github/actions/master-cache below, nothing else is worth caching.
          cache-disabled: true

      # Kotlin compile outputs are platform independent, so every job reads the entry for its flavor written by a Linux
      # job: debug by the Linux editor tests, release (DEBUG preprocessor flag off) by the Android release tests.
      - name: Restore Gradle build cache
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: gradle-build-cache-${{ matrix.release && 'release' || 'debug' }}
          path: ~/.gradle/caches/build-cache-1

      - name: Restore desktop Graal build output
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: desktop-graal-${{ matrix.build-task }}-${{ matrix.variant }}-${{ runner.os }}-${{ runner.arch }}
          # Compiled Godot-JVM libraries plus Gradle's per-build task history: the harness includes six builds and
          # each keeps its own .gradle/<version>/executionHistory. Without it nothing can be marked up to date.
          path: |
            kt/**/build
            kt/.gradle
            kt/api-generator/.gradle
            kt/common/.gradle
            kt/tools-common/.gradle
            kt/build-logic/.gradle
            harness/third-party-library/build
            harness/third-party-library/.gradle
            harness/tests/.gradle
            harness/tests/build

      - name: Download Windows editor library
        uses: actions/download-artifact@v7
        with:
          name: editor_windows_x86_64
          path: harness/tests/addons

      - name: Download Windows export library
        if: matrix.variant == 'export'
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.export-library }}
          path: harness/tests/addons

      - name: Prepare export
        if: matrix.variant == 'export'
        run: mkdir -p harness/tests/export

      - name: Build JVM tests project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.release && '-Prelease' || '' }} ${{ matrix.build-task }}

      - name: Build Graal native image
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.release && '-Prelease' || '' }} ${{ matrix.graal-build-task }}

      - name: Import test project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.release && '-Prelease' || '' }} importResources
        # Longer than the task's own 10 minute wait, so it can terminate a hung
        # editor itself instead of the step timeout leaving the process orphaned.
        timeout-minutes: 15

      - name: Run JVM tests
        if: matrix.variant == 'editor'
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-amd64-windows
          ./gradlew ${{ matrix.release && '-Prelease' || '' }} runGDTests
        timeout-minutes: 30

      - name: Run Graal native-image tests
        if: matrix.variant == 'editor'
        run: |
          cd harness/tests/
          ./gradlew ${{ matrix.release && '-Prelease' || '' }} runGraalGDTests
        timeout-minutes: 30

      - name: Create JRE for export
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-amd64-windows

      - name: Export JVM tests
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/
          ./gradlew ${{ matrix.release && '-Prelease' || '' }} ${{ matrix.export-task }}
        timeout-minutes: 30

      - name: Run JVM exported tests
        if: matrix.variant == 'export'
        run: cd harness/tests/; ./gradlew ${{ matrix.release && '-Prelease' || '' }} runExportedGDTests
        timeout-minutes: 30

      - name: Export Graal native-image tests
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/
          ./gradlew ${{ matrix.release && '-Prelease' || '' }} ${{ matrix.graal-export-task }}
        timeout-minutes: 30

      - name: Run Graal native-image exported tests
        if: matrix.variant == 'export'
        run: cd harness/tests/; ./gradlew ${{ matrix.release && '-Prelease' || '' }} runExportedGDTests
        timeout-minutes: 30

      - name: Upload JVM crash report
        if: always() && matrix.variant == 'export'
        uses: actions/upload-artifact@v7
        with:
          name: windows-exports-hs-err
          path: harness/tests/hs_err_pid*.log
          if-no-files-found: ignore

      - name: Save desktop Graal build output
        uses: ./.github/actions/master-cache
        with:
          mode: save
          cache-name: desktop-graal-${{ matrix.build-task }}-${{ matrix.variant }}-${{ runner.os }}-${{ runner.arch }}
          # Compiled Godot-JVM libraries plus Gradle's per-build task history: the harness includes six builds and
          # each keeps its own .gradle/<version>/executionHistory. Without it nothing can be marked up to date.
          path: |
            kt/**/build
            kt/.gradle
            kt/api-generator/.gradle
            kt/common/.gradle
            kt/tools-common/.gradle
            kt/build-logic/.gradle
            harness/third-party-library/build
            harness/third-party-library/.gradle
            harness/tests/.gradle
            harness/tests/build
