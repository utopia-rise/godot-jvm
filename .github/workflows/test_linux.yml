name: 🐧 Linux Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-linux_tests
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-22.04 # Run on the oldest Ubuntu we support. See build_linux.yml.
    env:
      # See VersionInfoPlugin: drop the commit hash from the build version so cached Kotlin/native-image outputs stay valid.
      ORG_GRADLE_PROJECT_reproducibleVersion: 'true'
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Editor tests
            variant: editor
            build-task: build
            graal-build-task: buildGraalNativeImage
          - name: Release export tests
            variant: export
            build-task: buildRelease
            graal-build-task: buildGraalNativeImageRelease
            export-task: exportRelease
            graal-export-task: exportGraalRelease
            export-library: release_linux_x86_64
          - name: Debug export tests
            variant: export
            build-task: build
            graal-build-task: buildGraalNativeImage
            export-task: exportDebug
            graal-export-task: exportGraalDebug
            export-library: debug_linux_x86_64

    steps:
      - name: Clone Godot JVM module
        uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: linux
          destination: harness/tests/bin

      - name: Download export templates
        if: matrix.variant == 'export'
        uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: linux
          destination: harness/tests/bin
          template: debug

      - name: Download release export templates
        if: matrix.variant == 'export'
        uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: linux
          destination: harness/tests/bin
          template: release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The Gradle build cache is shared through ./.github/actions/master-cache below, nothing else is worth caching.
          cache-disabled: true

      # Kotlin compile outputs are platform independent, so every job reads the single entry the Linux editor test job writes.
      - name: Restore Gradle build cache
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: gradle-build-cache
          path: ~/.gradle/caches/build-cache-1

      - name: Restore desktop Graal build output
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: desktop-graal-${{ matrix.build-task }}-${{ matrix.variant }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            kt/**/build
            harness/tests/.gradle
            harness/tests/build

      - name: Download Linux editor library
        uses: actions/download-artifact@v7
        with:
          name: editor_linux_x86_64
          path: harness/tests/addons

      - name: Download Linux export library
        if: matrix.variant == 'export'
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.export-library }}
          path: harness/tests/addons

      - name: Prepare export
        if: matrix.variant == 'export'
        run: |
          chmod +x harness/tests/bin/godot.*
          mkdir -p harness/tests/export

      - name: Build JVM tests project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Build Graal native image
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.graal-build-task }}

      - name: Import test project
        run: harness/tests/gradlew -p harness/tests/ importResources
        # Longer than the task's own 10 minute wait, so it can terminate a hung
        # editor itself instead of the step timeout leaving the process orphaned.
        timeout-minutes: 15

      - name: Run JVM tests
        if: matrix.variant == 'editor'
        run: |
          cd harness/tests/
          chmod +x bin/godot.*
          jlink --add-modules java.base,java.logging --output jvm/jre-amd64-linux
          ./gradlew runGDTests
        timeout-minutes: 30

      - name: Run Graal native-image tests
        if: matrix.variant == 'editor'
        run: |
          cd harness/tests/
          ./gradlew runGraalGDTests
        timeout-minutes: 30

      - name: Create JRE for export
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-amd64-linux

      - name: Export JVM tests
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/
          ./gradlew ${{ matrix.export-task }}
        timeout-minutes: 30

      - name: Run JVM exported tests
        if: matrix.variant == 'export'
        run: cd harness/tests/; ./gradlew runExportedGDTests
        timeout-minutes: 30

      - name: Export Graal native-image tests
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/
          ./gradlew ${{ matrix.graal-export-task }}
        timeout-minutes: 30

      - name: Run Graal native-image exported tests
        if: matrix.variant == 'export'
        run: cd harness/tests/; ./gradlew runExportedGDTests
        timeout-minutes: 30

      - name: Save desktop Graal build output
        uses: ./.github/actions/master-cache
        with:
          mode: save
          cache-name: desktop-graal-${{ matrix.build-task }}-${{ matrix.variant }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            kt/**/build
            harness/tests/.gradle
            harness/tests/build

      - name: Save Gradle build cache
        if: matrix.variant == 'editor'
        uses: ./.github/actions/master-cache
        with:
          mode: save
          cache-name: gradle-build-cache
          path: ~/.gradle/caches/build-cache-1
