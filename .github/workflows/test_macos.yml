name: 🍎 macOS Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-macos_tests
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-15
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Debug tests
            variant: debug
            build-task: build
          - name: Export tests
            variant: export
            build-task: buildRelease

    steps:
      - name: Clone Godot JVM module
        uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: macos
          destination: harness/tests/bin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always
          gradle-home-cache-excludes: |
            wrapper/dists
            caches/*/generated-gradle-jars
            daemon
            notifications

      - name: Cache desktop Graal build output
        uses: actions/cache@v4
        with:
          path: |
            harness/tests/.gradle
            harness/tests/build
          key: desktop-graal-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            desktop-graal-${{ runner.os }}-${{ runner.arch }}-

      - name: Download macOS editor library
        uses: actions/download-artifact@v7
        with:
          name: debug_macos_universal
          path: harness/tests/addons

      - name: Download macOS export library
        if: matrix.variant == 'export'
        uses: actions/download-artifact@v7
        with:
          name: release_macos_universal
          path: harness/tests/addons

      - name: Prepare export
        if: matrix.variant == 'export'
        run: |
          chmod +x harness/tests/bin/godot.*
          mkdir -p harness/tests/export
          curl --fail --location https://github.com/godotengine/godot-builds/releases/download/${{ inputs.godot-version }}/Godot_v${{ inputs.godot-version }}_export_templates.tpz --output templates.tpz
          unzip -q templates.tpz -d templates
          template_version="${{ inputs.godot-version }}"
          template_version="${template_version//-/.}"
          template_directory="$HOME/Library/Application Support/Godot/export_templates/$template_version"
          mkdir -p "$template_directory"
          mv templates/templates/macos.zip "$template_directory/macos.zip"

      - name: Build JVM tests project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Build Graal native image
        run: harness/tests/gradlew -p harness/tests/ buildGraalNativeImage

      - name: Import test project
        run: harness/tests/gradlew -p harness/tests/ importResources

      - name: Run JVM tests
        if: matrix.variant == 'debug'
        run: |
          cd harness/tests/
          chmod +x bin/godot.*
          jlink --add-modules java.base,java.logging --output jvm/jre-arm64-macos
          ./gradlew runGDTests
        timeout-minutes: 30

      - name: Run Graal native-image tests
        if: matrix.variant == 'debug'
        run: |
          cd harness/tests/
          ./gradlew runGraalGDTests
        timeout-minutes: 30

      - name: Create JRE for export
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-arm64-macos
          mkdir jvm/jre-amd64-macos # The export requires this directory; tests run on arm64.

      - name: Export release tests
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/
          ./gradlew exportRelease
        timeout-minutes: 30

      - name: Extract app from DMG
        if: matrix.variant == 'export'
        run: |
          cd harness/tests/export
          hdiutil attach tests.dmg
          cp -a /Volumes/Godot-JVM\ Tests/Godot-JVM\ Tests.app Godot-JVM\ Tests.app
          hdiutil detach /Volumes/Godot-JVM\ Tests
          cp -a ../jvm/jre-arm64-macos Godot-JVM\ Tests.app/Contents/PlugIns/

      - name: Run JVM exported tests
        if: matrix.variant == 'export'
        run: cd harness/tests/; ./gradlew runExportedGDTests
        timeout-minutes: 30

      - name: Run Graal native-image exported tests
        if: matrix.variant == 'export'
        run: cd harness/tests/; ./gradlew runExportedGraalGDTests
        timeout-minutes: 30
