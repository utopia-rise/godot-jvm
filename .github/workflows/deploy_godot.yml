name: Deploy GDExtension artifacts
on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string

jobs:
  deploy-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: deploy_release_url
      - id: release_url
        run: echo "release_url=$(cat deploy_release_url.txt)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v7
        with:
          name: godot-jvm-addon-${{ inputs.godot-jvm-version }}
          path: package
      # This is the only point the addon actually needs to exist as a real zip file: release assets
      # are downloaded as-is, with no extra wrapping layer from GitHub the way workflow artifacts get.
      - name: Zip addon
        shell: bash
        run: cd package && zip -q -9 -r ../godot-jvm-addon-${{ inputs.godot-jvm-version }}.zip addons
      - uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release_url.outputs.release_url }}
          asset_path: godot-jvm-addon-${{ inputs.godot-jvm-version }}.zip
          asset_name: godot-jvm-addon-${{ inputs.godot-jvm-version }}.zip
          asset_content_type: application/octet-stream

  deploy-libraries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linuxbsd
            arch: x86_64
            target: debug
          - platform: linuxbsd
            arch: x86_64
            target: release
          - platform: windows
            arch: x86_64
            target: debug
          - platform: windows
            arch: x86_64
            target: release
          - platform: macos
            arch: universal
            target: debug
          - platform: macos
            arch: universal
            target: release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: deploy_release_url
      - id: release_url
        run: echo "release_url=$(cat deploy_release_url.txt)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v7
        with:
          name: godot-jvm-gdextension-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ inputs.godot-jvm-version }}
          path: package
      # This is the only point the library actually needs to exist as a real zip file: release assets
      # are downloaded as-is, with no extra wrapping layer from GitHub the way workflow artifacts get.
      - name: Zip library
        shell: bash
        run: cd package && zip -q -9 -r ../godot-jvm-gdextension-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ inputs.godot-jvm-version }}.zip addons
      - uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release_url.outputs.release_url }}
          asset_path: godot-jvm-gdextension-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ inputs.godot-jvm-version }}.zip
          asset_name: godot-jvm-gdextension-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ inputs.godot-jvm-version }}.zip
          asset_content_type: application/octet-stream
