name: Deploy GDExtension artifacts
on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string

jobs:
  deploy-addon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: godot-jvm-addon-${{ inputs.godot-jvm-version }}
          path: package

      # This is the only point the addon actually needs to exist as a real zip file: release assets
      # are downloaded as-is, with no extra wrapping layer from GitHub the way workflow artifacts get.
      - name: Zip addon
        shell: bash
        run: cd package && zip -q -9 -r ../godot-jvm-addon-${{ inputs.godot-jvm-version }}.zip addons

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.godot-jvm-version }}" godot-jvm-addon-${{ inputs.godot-jvm-version }}.zip --clobber

  deploy-libraries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        platform: [android, ios, linux, macos, windows]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: godot-jvm-gdextension-${{ matrix.platform }}-${{ inputs.godot-jvm-version }}
          path: package

      # This is the only point the library actually needs to exist as a real zip file: release assets
      # are downloaded as-is, with no extra wrapping layer from GitHub the way workflow artifacts get.
      - name: Zip library
        shell: bash
        run: cd package && zip -q -9 -r ../godot-jvm-gdextension-${{ matrix.platform }}-${{ inputs.godot-jvm-version }}.zip ${{ matrix.platform }}

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.godot-jvm-version }}" godot-jvm-gdextension-${{ matrix.platform }}-${{ inputs.godot-jvm-version }}.zip --clobber
