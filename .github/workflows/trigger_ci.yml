name: CI
on:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-trigger_ci
  cancel-in-progress: true

env:
  GODOT_JVM_VERSION: &godot_jvm_version ${{ github.sha }}
  GODOT_VERSION: &godot_version 4.7.2-stable
  JVM_VERSION: &jvm_version '17'

jobs:
  # Path-change gate. A pure-doc PR (or one only touching e.g. the api-generator)
  # shouldn't trigger the native gdextension build/assemble/test chain, and vice versa.
  # One job, one checkout, four diffs.
  detect-changes:
    name: 🔍 Detect changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.native.outputs.changed }}
      ci-cd-tests: ${{ steps.ci-cd-tests.outputs.changed }}
      api-generator: ${{ steps.api-generator.outputs.changed }}
      ide-plugin: ${{ steps.ide-plugin.outputs.changed }}
    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Native gdextension source and Kotlin runtime libraries
        id: native
        uses: ./.github/actions/detect-path-changes
        with:
          paths: |
            cpp
            kt/android-plugin
            godot-cpp
            SConstruct
            platform
            kt/godot-library
            kt/godot-registration
            kt/common
            kt/tools-common
            kt/build-logic
      - name: CI/CD, Gradle plugin and test harness
        id: ci-cd-tests
        uses: ./.github/actions/detect-path-changes
        with:
          paths: |
            .github
            kt/gradle
            kt/build-logic
            kt/settings.gradle.kts
            kt/build.gradle.kts
            kt/plugins/godot-gradle-plugin
            harness/tests
            harness/editor-monkey
      - name: API generator
        id: api-generator
        uses: ./.github/actions/detect-path-changes
        with:
          paths: |
            kt/api-generator
            kt/common
            kt/tools-common
      - name: IDE plugin
        id: ide-plugin
        uses: ./.github/actions/detect-path-changes
        with:
          paths: |
            kt/plugins/godot-intellij-plugin
            kt/common
            kt/tools-common

  check-specs:
    name: 📜 Check specs
    runs-on: ubuntu-latest
    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate specs directory
        run: python specs/check_specs.py

  build-jvm:
    name: ☕ Build Jvm
    uses: ./.github/workflows/build_jvm.yml
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.api-generator == 'true' || needs.detect-changes.outputs.ide-plugin == 'true' || needs.detect-changes.outputs.ci-cd-tests == 'true'
    with:
      jvm-version: *jvm_version
      run-api-generator: ${{ needs.detect-changes.outputs.api-generator == 'true' }}
      run-ide-plugin: ${{ needs.detect-changes.outputs.ide-plugin == 'true' }}

  build-android:
    name: 🤖 Build Android
    uses: ./.github/workflows/build_android.yml
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.native == 'true' || needs.detect-changes.outputs.ci-cd-tests == 'true'
    with:
      jvm-version: *jvm_version

  build-ios:
    name: 🍏 Build iOS
    uses: ./.github/workflows/build_ios.yml
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.native == 'true' || needs.detect-changes.outputs.ci-cd-tests == 'true'
    with:
      jvm-version: *jvm_version

  build-linux:
    name: 🐧 Build Linux
    uses: ./.github/workflows/build_linux.yml
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.native == 'true' || needs.detect-changes.outputs.ci-cd-tests == 'true'

  build-macos:
    name: 🍎 Build macOS
    uses: ./.github/workflows/build_macos.yml
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.native == 'true' || needs.detect-changes.outputs.ci-cd-tests == 'true'

  build-windows:
    name: 🪟 Build Windows
    uses: ./.github/workflows/build_windows.yml
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.native == 'true' || needs.detect-changes.outputs.ci-cd-tests == 'true'

  assemble-android:
    name: 🤖 Assemble Android
    uses: ./.github/workflows/assemble_android.yml
    needs:
      - build-android
    with:
      godot-jvm-version: *godot_jvm_version
      godot-version: *godot_version
      jvm-version: *jvm_version

  assemble-ios:
    name: 🍏 Assemble iOS
    uses: ./.github/workflows/assemble_ios.yml
    needs:
      - build-ios
    with:
      godot-jvm-version: *godot_jvm_version

  assemble-linux:
    name: 🐧 Assemble Linux
    uses: ./.github/workflows/assemble_linux.yml
    needs:
      - build-linux
    with:
      godot-jvm-version: *godot_jvm_version

  assemble-macos:
    name: 🍎 Assemble macOS
    uses: ./.github/workflows/assemble_macos.yml
    needs:
      - build-macos
    with:
      godot-jvm-version: *godot_jvm_version

  assemble-windows:
    name: 🪟 Assemble Windows
    uses: ./.github/workflows/assemble_windows.yml
    needs:
      - build-windows
    with:
      godot-jvm-version: *godot_jvm_version

  test-editor-monkey:
    name: 🐒 Test editor
    uses: ./.github/workflows/test_editor_monkey.yml
    needs:
      - assemble-linux
    with:
      godot-version: *godot_version
      jvm-version: *jvm_version

  test-android:
    name: 🤖 Test Android
    uses: ./.github/workflows/test_android.yml
    needs:
      - assemble-android
      - build-linux
    with:
      godot-version: *godot_version
      jvm-version: *jvm_version

  test-ios:
    name: 🍏 Test iOS
    uses: ./.github/workflows/test_ios.yml
    needs:
      - assemble-ios
      - assemble-macos
    with:
      godot-version: *godot_version
      jvm-version: *jvm_version

  test-linux:
    name: 🐧 Test Linux
    uses: ./.github/workflows/test_linux.yml
    needs:
      - assemble-linux
    with:
      godot-version: *godot_version
      jvm-version: *jvm_version

  test-macos:
    name: 🍎 Test macOS
    uses: ./.github/workflows/test_macos.yml
    needs:
      - assemble-macos
    with:
      godot-version: *godot_version
      jvm-version: *jvm_version

  test-windows:
    name: 🪟 Test Windows
    uses: ./.github/workflows/test_windows.yml
    needs:
      - assemble-windows
    with:
      godot-version: *godot_version
      jvm-version: *jvm_version

  assemble-addon:
    name: 📦 Package addon
    uses: ./.github/workflows/assemble_addon.yml
    needs:
      - assemble-android
      - assemble-ios
      - assemble-linux
      - assemble-macos
      - assemble-windows
      - test-android
      - test-ios
      - test-linux
      - test-editor-monkey
      - test-macos
      - test-windows
    with:
      godot-jvm-version: *godot_jvm_version

