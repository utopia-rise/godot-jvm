name: Linux Builds
on:
  workflow_call:

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-linux_build
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: ${{ matrix.name }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build debug x86_64
            cache-name: debug_linux_x86_64
            target: editor
            scons-flags: ''
          - name: Build release x86_64
            cache-name: release_linux_x86_64
            target: template_release
            scons-flags: ''
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install scons
      - uses: ./.github/actions/scons-cache
        with:
          mode: restore
          cache-name: ${{ matrix.cache-name }}
      - uses: ./.github/actions/install-linux-deps
      - uses: ./.github/actions/gdextension-build
        with:
          platform: linux
          target: ${{ matrix.target }}
          scons-flags: ${{ matrix.scons-flags }}
          target-path: artifact/addons/jvm/libs/
      - uses: ./.github/actions/scons-cache
        if: always()
        with:
          mode: save
          cache-name: ${{ matrix.cache-name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cache-name }}
          path: artifact/addons
