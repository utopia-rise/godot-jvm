name: 🪟 Windows Exports Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows_exports_tests
  cancel-in-progress: true

jobs:
  test-windows-exports:
    runs-on: windows-latest
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: release tests
            target: release
            jvm-target: release
            build-task: buildRelease

    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: windows
          destination: harness/tests/bin

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: windows
          destination: harness/tests/bin
          template: debug

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: windows
          destination: harness/tests/bin
          template: release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Visual Studio native-image environment
        shell: pwsh
        run: |
          $vcVars = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Filter vcvars64.bat -Recurse | Select-Object -First 1
          if ($null -eq $vcVars) { throw 'Could not find Visual Studio vcvars64.bat' }
          "VC_VARS_PATH=$($vcVars.FullName)" >> $env:GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always
          gradle-home-cache-excludes: |
            wrapper/dists
            caches/*/generated-gradle-jars
            daemon
            notifications

      - name: Cache desktop Graal build output
        uses: actions/cache@v4
        with:
          path: |
            harness/tests/.gradle
            harness/tests/build
          key: desktop-graal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/test_windows_exports.yml', 'harness/tests/**', 'harness/third-party-library/**', 'kt/**') }}
          restore-keys: |
            desktop-graal-${{ runner.os }}-${{ runner.arch }}-

      - name: Download windows editor library
        uses: actions/download-artifact@v7
        with:
          name: debug_windows_x86_64
          path: './harness/tests/addons'

      - name: Download windows export library
        uses: actions/download-artifact@v7
        with:
          name: release_windows_x86_64
          path: './harness/tests/addons'

      - name: Prepare export
        run: |
          mkdir -p harness/tests/export

      - name: Build JVM tests project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Build Graal native image
        run: harness/tests/gradlew -p harness/tests/ buildGraalNativeImage

      - name: Import test project
        run: harness/tests/gradlew -p harness/tests/ importResources

      - name: Create JRE
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-amd64-windows

      - name: Export tests release
        run: |
          cd harness/tests/
          ./gradlew exportRelease
        timeout-minutes: 30

      - name: Run JVM exported tests
        run: cd harness/tests/; ./gradlew runExportedGDTests
        timeout-minutes: 30

      - name: Run Graal native-image exported tests
        run: cd harness/tests/; ./gradlew runExportedGraalGDTests
        timeout-minutes: 30

      # DIAGNOSTIC (temporary): the JVM's own crash handler (HotSpot) installs a top-level SEH
      # filter that takes priority over Godot's, so a native crash never reaches Godot's own
      # handler and the log shows nothing beyond the exit code. HotSpot writes its own native
      # crash report (hs_err_pid<PID>.log) to the process's working directory by default -- which
      # is harness/tests/ here (Exec.workingDir = projectDir), not harness/tests/export/. Upload it
      # so the actual faulting frame is visible without needing a local repro.
      - name: Upload JVM crash report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-exports-hs-err
          path: harness/tests/hs_err_pid*.log
          if-no-files-found: ignore
