name: ☕ Jvm Builds
on:
  workflow_call:
    inputs:
      jvm-version:
        type: string
      run-api-generator:
        type: boolean
        default: true
      run-ide-plugin:
        type: boolean
        default: true

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-jvm_build
  cancel-in-progress: true

jobs:
  build-api-generator:
    runs-on: ubuntu-latest
    name: Build API generator
    env:
      # See VersionInfoPlugin: same build version as the test jobs, so their Gradle build cache entries apply here.
      ORG_GRADLE_PROJECT_reproducibleVersion: 'true'
    if: inputs.run-api-generator

    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The Gradle build cache is shared through ./.github/actions/gradle-build-cache below, nothing else is worth caching.
          cache-disabled: true

      # Kotlin compile outputs are platform independent, so every job reads the entry for its flavor written by a Linux
      # job: debug by the Linux editor tests, release (DEBUG preprocessor flag off) by the Android release tests.
      - name: Restore Gradle build cache
        uses: ./.github/actions/gradle-build-cache
        with:
          mode: restore
          flavor: debug
      - name: Restore Gradle dependencies
        uses: ./.github/actions/gradle-deps-cache
        with:
          mode: restore

      - name: Build API generator
        run: kt/gradlew -p kt :api-generator:build

      - name: Upload api-generator artifact
        uses: actions/upload-artifact@v7
        with:
          name: jvm_api-generator
          path: |
            kt/api-generator/build/libs/api-generator-*.jar

  build-ide-plugin:
    runs-on: ubuntu-latest
    name: Build and verify IDE plugin
    if: inputs.run-ide-plugin
    env:
      ORG_GRADLE_PROJECT_reproducibleVersion: 'true'

    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The Gradle build cache is shared through ./.github/actions/gradle-build-cache below, nothing else is worth caching.
          cache-disabled: true

      # Kotlin compile outputs are platform independent, so every job reads the entry for its flavor written by a Linux
      # job: debug by the Linux editor tests, release (DEBUG preprocessor flag off) by the Android release tests.
      - name: Restore Gradle build cache
        uses: ./.github/actions/gradle-build-cache
        with:
          mode: restore
          flavor: debug
      - name: Restore Gradle dependencies
        uses: ./.github/actions/gradle-deps-cache
        with:
          mode: restore

      - name: Restore Kotlin build outputs
        uses: ./.github/actions/kotlin-cache
        with:
          mode: restore
          name: ide-plugin

      - name: Build and verify IDE plugin
        run: kt/gradlew -p kt :godot-intellij-plugin:buildPlugin :godot-intellij-plugin:verifyPlugin

      - name: Upload intellij-plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: jvm_intellij-plugin
          path: kt/plugins/godot-intellij-plugin/build/distributions/godot-intellij-plugin-*.zip

      - name: Save Kotlin build outputs
        uses: ./.github/actions/kotlin-cache
        with:
          mode: save
          name: ide-plugin
