name: 📝 Create draft release

on:
  workflow_call:

jobs:
  create-draft-release:
    name: Create github draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(dev|rc)[1-9][0-9]*)?$ ]]; then
            echo "Expected x.y.z, x.y.z-devX or x.y.z-rcX, where X is a positive integer."
            exit 1
          fi

      # The deploy workflows attach their assets to this draft by tag name with `gh release upload`.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-dev* || "$GITHUB_REF_NAME" == *-rc* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "" $prerelease
