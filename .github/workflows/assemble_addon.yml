name: Assemble addon
on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string

jobs:
  package-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: godot-jvm-gdextension-*-${{ inputs.godot-jvm-version }}
          path: libs
          merge-multiple: true
      - name: Assemble addon
        shell: bash
        run: |
          set -euo pipefail
          for platform in android ios linux macos windows; do
            if [[ ! -d "libs/$platform" ]]; then
              echo "Missing the $platform libraries" >&2
              exit 1
            fi
          done
          mkdir -p package/addons
          cp -R harness/tests/addons/jvm package/addons/jvm
          cp README.md LICENSE package/addons/jvm/
          rm -rf package/addons/jvm/libs
          cp -R libs package/addons/jvm/libs
      # Upload the raw "addons" folder rather than a pre-made zip: actions/upload-artifact always
      # wraps whatever it's given in its own zip, so uploading a zip here results in a zip nested
      # inside that zip once a human downloads the artifact. The actual release-asset zip gets made
      # once, at the point deploy_godot.yml attaches it to the GitHub release.
      - uses: actions/upload-artifact@v7
        with:
          name: godot-jvm-addon-${{ inputs.godot-jvm-version }}
          path: package
