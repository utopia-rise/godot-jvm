name: 🍏 iOS Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
        required: true
      jvm-version:
        type: string
        required: true

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-ios_tests
  cancel-in-progress: true

jobs:
  test-ios:
    runs-on: macos-15
    env:
      # See VersionInfoPlugin: drop the commit hash from the build version so cached Kotlin/native-image outputs stay valid.
      ORG_GRADLE_PROJECT_reproducibleVersion: 'true'
    name: ${{ matrix.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug export tests
            build-task: buildIOS
            export-task: exportIOSDebug
            xcode-configuration: Debug
            variant: debug
          - name: Release export tests
            build-task: -Prelease buildIOS
            export-task: exportIOSRelease
            xcode-configuration: Release
            variant: release
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: ${{ inputs.godot-version }}
          platform: macos
          destination: harness/tests/bin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - name: Set up GraalVM for JDK 25.0.2
        run: |
          curl --fail --location https://download.oracle.com/graalvm/25/archive/graalvm-jdk-25.0.2_macos-aarch64_bin.tar.gz --output graalvm.tar.gz
          tar -xzf graalvm.tar.gz
          graalvm_home="$(find "$PWD" -type f -path '*/bin/native-image' -print -quit | xargs dirname | xargs dirname)"
          test -n "$graalvm_home"
          echo "GRAALVM_HOME=$graalvm_home" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The Gradle build cache is shared through ./.github/actions/master-cache below, nothing else is worth caching.
          cache-disabled: true

      # Kotlin compile outputs are platform independent, so every job reads the two entries written by the Linux
      # test jobs: the debug one from the editor tests, the release one (DEBUG preprocessor flag off) from the Android
      # release tests. Both restore into the same directory; Gradle's build cache is content addressed.
      - name: Restore Gradle build cache (debug)
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: gradle-build-cache-debug
          path: ~/.gradle/caches/build-cache-1
      - name: Restore Gradle build cache (release)
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: gradle-build-cache-release
          path: ~/.gradle/caches/build-cache-1

      - name: Restore iOS native-image output
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: ios-native-image-${{ matrix.variant }}-${{ runner.arch }}
          # Compiled Godot-JVM libraries plus Gradle's per-build task history: the harness includes six builds and
          # each keeps its own .gradle/<version>/executionHistory. Without it nothing can be marked up to date.
          path: |
            kt/**/build
            kt/.gradle
            kt/api-generator/.gradle
            kt/common/.gradle
            kt/tools-common/.gradle
            kt/build-logic/.gradle
            harness/third-party-library/build
            harness/third-party-library/.gradle
            harness/tests/.gradle
            harness/tests/build/graal
            harness/tests/build/libs/ios
            harness/tests/jvm/ios

      - name: Download macOS editor library
        uses: actions/download-artifact@v7
        with:
          name: editor_macos_universal
          path: harness/tests/addons

      - name: Download the iOS GDExtension addon
        uses: actions/download-artifact@v7
        with:
          name: godot-jvm-gdextension-ios
          path: harness/tests

      - name: Prepare iOS export template
        run: |
          chmod +x harness/tests/bin/godot.*
          curl --fail --location https://github.com/godotengine/godot-builds/releases/download/${{ inputs.godot-version }}/Godot_v${{ inputs.godot-version }}_export_templates.tpz --output templates.tpz
          unzip -q templates.tpz -d templates
          template_version="${{ inputs.godot-version }}"
          template_version="${template_version//-/.}"
          template_directory="$HOME/Library/Application Support/Godot/export_templates/$template_version"
          mkdir -p "$template_directory"
          mv templates/templates/ios.zip "$template_directory/ios.zip"
          sed -i '' 's|application/export_project_only=false|application/export_project_only=true|' harness/tests/export_presets.cfg

      - name: Build JVM tests project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Export iOS test project
        run: harness/tests/gradlew -p harness/tests/ ${{ matrix.export-task }}
        timeout-minutes: 30

      # Device build only, so no execution: Godot's official simulator template slice is x86_64
      # while the GraalVM usercode image is arm64, and the two can never link together.
      - name: Link the exported iOS application
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild \
            -project harness/tests/export/tests.xcodeproj \
            -scheme tests \
            -sdk iphoneos \
            -configuration ${{ matrix.xcode-configuration }} \
            -destination 'generic/platform=iOS' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Save iOS native-image output
        uses: ./.github/actions/master-cache
        with:
          mode: save
          cache-name: ios-native-image-${{ matrix.variant }}-${{ runner.arch }}
          # Compiled Godot-JVM libraries plus Gradle's per-build task history: the harness includes six builds and
          # each keeps its own .gradle/<version>/executionHistory. Without it nothing can be marked up to date.
          path: |
            kt/**/build
            kt/.gradle
            kt/api-generator/.gradle
            kt/common/.gradle
            kt/tools-common/.gradle
            kt/build-logic/.gradle
            harness/third-party-library/build
            harness/third-party-library/.gradle
            harness/tests/.gradle
            harness/tests/build/graal
            harness/tests/build/libs/ios
            harness/tests/jvm/ios
