name: 🚀 Deploy

on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string
      jvm-version:
        type: string

env:
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.UTOPIA_RISE_GPG_PRIVATE_KEY_ASCII }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.UTOPIA_RISE_GPG_KEY_PASSPHRASE }}
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.UTOPIA_RISE_MAVEN_CENTRAL_PORTAL_TOKEN_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.UTOPIA_RISE_MAVEN_CENTRAL_PORTAL_TOKEN_PASSWORD }}
  GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
  GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
  GODOT_JVM_INTELLIJ_PLUGIN_PUBLISH: ${{ secrets.GODOT_JVM_INTELLIJ_PLUGIN_PUBLISH }}

jobs:
  deploy-jvm:
    name: Deploy jvm artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6
        with:
          path: modules/kotlin_jvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The Gradle build cache is shared through ./.github/actions/master-cache below, nothing else is worth caching.
          cache-disabled: true

      # Kotlin compile outputs are platform independent, so every job reads the single entry the Linux editor test job writes.
      - name: Restore Gradle build cache
        uses: ./.github/actions/master-cache
        with:
          mode: restore
          cache-name: gradle-build-cache
          path: ~/.gradle/caches/build-cache-1

      - name: Publish common
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :common:publish

      - name: Publish tools-common
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :tools-common:publish

      - name: Publish api-generator
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :api-generator:publish

      - name: Publish godot-registration
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-registration:publish

      - name: Publish godot-internal-library debug
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-internal-library:publish -Pdebug

      - name: Publish godot-internal-library release
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-internal-library:publish -Prelease

      - name: Publish godot-core-library debug
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-core-library:publish -Pdebug

      - name: Publish godot-core-library release
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-core-library:publish -Prelease

      - name: Publish godot-api-library debug
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-api-library:publish -Pdebug

      - name: Publish godot-api-library release
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-api-library:publish -Prelease

      - name: Publish godot-bootstrap-library debug
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-bootstrap-library:publish -Pdebug

      - name: Publish godot-bootstrap-library release
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-bootstrap-library:publish -Prelease

      - name: Publish godot-extension-library debug
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-extension-library:publish -Pdebug

      - name: Publish godot-extension-library release
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-extension-library:publish -Prelease

      - name: Publish godot-coroutine-library debug
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-coroutine-library:publish -Pdebug

      - name: Publish godot-coroutine-library release
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-coroutine-library:publish -Prelease

      - name: Publish godot plugins
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-gradle-plugin:publish :godot-gradle-plugin:publishPlugins -Pgradle.publish.key=$GRADLE_PUBLISH_KEY -Pgradle.publish.secret=$GRADLE_PUBLISH_SECRET

      - name: Build IntelliJ plugin
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-intellij-plugin:buildPlugin
          cp modules/kotlin_jvm/kt/plugins/godot-intellij-plugin/build/distributions/godot-intellij-plugin-*.zip godot-jvm-intellij-plugin-${{ inputs.godot-jvm-version }}.zip

      - name: Publish IntelliJ plugin to the Marketplace
        if: ${{ !contains(inputs.godot-jvm-version, '-dev') && !contains(inputs.godot-jvm-version, '-rc') }}
        shell: sh
        run: |
          modules/kotlin_jvm/kt/gradlew -p modules/kotlin_jvm/kt/ :godot-intellij-plugin:publishPlugin

      - name: Upload IntelliJ plugin release asset
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.godot-jvm-version }}" godot-jvm-intellij-plugin-${{ inputs.godot-jvm-version }}.zip --clobber
