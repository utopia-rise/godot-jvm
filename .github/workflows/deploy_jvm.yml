name: 🚀 Deploy

on:
  workflow_call:
    inputs:
      godot-jvm-version:
        type: string
      jvm-version:
        type: string

env:
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.UTOPIA_RISE_GPG_PRIVATE_KEY_ASCII }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.UTOPIA_RISE_GPG_KEY_PASSPHRASE }}
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.UTOPIA_RISE_MAVEN_CENTRAL_PORTAL_TOKEN_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.UTOPIA_RISE_MAVEN_CENTRAL_PORTAL_TOKEN_PASSWORD }}
  GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
  GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
  GODOT_JVM_INTELLIJ_PLUGIN_PUBLISH: ${{ secrets.GODOT_JVM_INTELLIJ_PLUGIN_PUBLISH }}

jobs:
  deploy-jvm:
    name: Deploy jvm artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The Gradle build cache is shared through ./.github/actions/gradle-build-cache below, nothing else is worth caching.
          cache-disabled: true

      # godot-jvm compiles every module in both flavors, so both entries of the shared Kotlin build cache apply.
      - name: Restore Gradle build cache (debug)
        uses: ./.github/actions/gradle-build-cache
        with:
          mode: restore
          flavor: debug
      - name: Restore Gradle build cache (release)
        uses: ./.github/actions/gradle-build-cache
        with:
          mode: restore
          flavor: release
      - name: Restore Gradle dependencies
        uses: ./.github/actions/gradle-deps-cache
        with:
          mode: restore

      - name: Publish godot-jvm and the Gradle plugin
        shell: sh
        run: |
          kt/gradlew -p kt publishCentral -Pgradle.publish.key=$GRADLE_PUBLISH_KEY -Pgradle.publish.secret=$GRADLE_PUBLISH_SECRET

      - name: Build IntelliJ plugin
        shell: sh
        run: |
          kt/gradlew -p kt :godot-intellij-plugin:buildPlugin
          cp kt/plugins/godot-intellij-plugin/build/distributions/godot-intellij-plugin-*.zip godot-jvm-intellij-plugin-${{ inputs.godot-jvm-version }}.zip

      - name: Publish IntelliJ plugin to the Marketplace
        if: ${{ !contains(inputs.godot-jvm-version, '-dev') && !contains(inputs.godot-jvm-version, '-rc') }}
        shell: sh
        run: |
          kt/gradlew -p kt :godot-intellij-plugin:publishPlugin

      - name: Upload IntelliJ plugin release asset
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.godot-jvm-version }}" godot-jvm-intellij-plugin-${{ inputs.godot-jvm-version }}.zip --clobber
