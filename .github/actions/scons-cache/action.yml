name: SCons cache
description: >
  Restores this branch/PR's own SCons cache, falling back to master's if this branch has none yet.
  On save, deletes the branch's previous cache entry first so each branch/PR keeps exactly one
  cache instead of accumulating a new one per push.
inputs:
  mode:
    description: "'restore' (before the build) or 'save' (after the build)."
    required: true
  cache-name:
    description: Cache name for one platform, architecture, and target.
    default: ${{ github.job }}
  scons-cache:
    description: SCons cache path.
    default: ${{ github.workspace }}/.scons-cache

runs:
  using: composite
  steps:
    # A stable per-branch key (no sha/run-id) is what lets "save" replace the same entry every time
    # instead of accumulating one per commit.
    - name: Compute cache key
      id: key
      shell: bash
      run: echo "key=scons-${{ inputs.cache-name }}-${{ github.head_ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

    - name: Restore SCons cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.scons-cache }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          scons-${{ inputs.cache-name }}-master

    # actions/cache/save silently no-ops if a cache with this exact key already exists (keys are
    # immutable), so the previous entry for this branch has to be deleted first or the cache would
    # never actually refresh after the first push. Requires the `actions: write` permission; on a
    # forked PR the token is always read-only and this step fails harmlessly, restore-keys just
    # keeps serving the older cache next time.
    - name: Delete this branch's previous cache
      if: inputs.mode == 'save'
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method DELETE "repos/${{ github.repository }}/actions/caches?key=${{ steps.key.outputs.key }}&ref=${{ github.ref }}" --silent || true

    - name: Save SCons cache
      if: inputs.mode == 'save'
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.scons-cache }}
        key: ${{ steps.key.outputs.key }}
